<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>CoS ボード</title>
  <link rel="stylesheet" href="/board.css">
  <script type="module" src="/board.js"></script>
</head>
<body>
  <header class="masthead">
    <div><p class="eyebrow">CHIEF OF STAFF</p><h1>CoS <span>ボード</span></h1></div>
    <div class="status"><p id="connection">取得しています…</p><p id="summary">台帳とセッションの状況</p></div>
  </header>
  <main>
    <div id="offline" class="alert error" role="status" hidden></div>
    <div id="focus-status" class="focus-status" role="status" aria-live="polite"></div>
    <div id="alerts" aria-live="polite"></div>
    <section id="drafts" aria-label="下書き" hidden></section>
    <div id="board" class="board" aria-label="タスクの状況"></div>
    <noscript><p class="alert error">このボードを表示するには JavaScript が必要です。</p></noscript>
  </main>
  <footer>台帳・報告は読み取り専用 <span aria-hidden="true">·</span> カードを押すと Herdr の場所を開きます <span aria-hidden="true">·</span> 時刻は日本時間</footer>
</body>
</html>
